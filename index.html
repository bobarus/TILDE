  let sub=s.t===0?'Скоро':(s.k===s.t?'Пройден':(L===cl?'Сейчас':s.t+' карточек'));
  let inner='';
  if(L===cl&&s.t)inner=`<div class="lin"><div class="row2"><b style="font-weight:500">${s.k} из ${s.t}</b><span class="sm">${pct}%</span></div><div class="trk" style="margin-top:6px"><i data-w="${pct}" style="background:${col}"></i></div>`+Object.entries(tops).map(([n,v])=>`<div class="tp2"><span>${esc(n)}</span><div class="trk"><i data-w="${Math.round(v.k/v.t*100)}" style="background:${col}"></i></div></div>`).join('')+`</div>`;
  else if(s.t)inner=`<div class="trk" style="margin-top:10px"><i data-w="${pct}" style="background:${col}"></i></div>`;
  return `<div class="lc${s.t===0||(L!==cl&&s.k<s.t)?' lock':''}"><div class="lh"><div class="lic" style="color:${col}">${L}</div><div class="t"><b>Уровень ${L}</b><span>${sub}${s.t&&L!==cl?' · '+s.k+' из '+s.t:''}</span></div><div class="lar">${s.k===s.t&&s.t?'✓':'›'}</div></div>${inner}</div>`}).join('');
 const goalP=Math.min(100,Math.round(ST.tn/GOAL*100));
 const qs=(window._quests||[]).map(q=>`<div class="q">${esc(q.text)}</div>`).join('');
 const nc=window._newCards||0;
 app.innerHTML=`<div class="hdr"><div><div class="sm">Учим испанский</div><h1>Tilde</h1></div><span class="sp"></span><span class="mu" id="sync">${sync}</span></div>
 <div class="hero"><div class="hl">Слов знаю</div><div class="hn">${KW.size}</div><div class="hs">учу ${LW.size} · сегодня ${Math.min(ST.tn,GOAL)} из ${GOAL}</div>
 <div class="acts"><button class="act" data-a="study"><span class="ci">${ICON.study}</span>Изучить${LW.size?'':''}</button><button class="act" data-a="words"><span class="ci">${ICON.words}</span>Слова</button><button class="act" data-a="map"><span class="ci">${ICON.map}</span>Уровни</button></div></div>
 <button class="btn pr" id="pl" style="margin-top:12px;padding:16px;font-size:17px">Играть · ${cl}</button>
 <button class="btn" id="rp" style="margin-top:10px;border-radius:999px">Повторить ошибки · ${learnIdx().length}</button>
 <div class="tiles"><div class="card0 tile" style="margin:0"><small>Серия</small><b>${streakNow()}</b><span class="dn">дней подряд</span></div><div class="card0 tile" style="margin:0"><small>Опыт</small><b>${ST.xp}</b><span class="dn">уровень игрока ${level()}</span></div></div>
 <div class="card0"><div class="row"><b style="font-weight:500">Цель на сегодня</b><span class="sp"></span><span class="sm">${goalP}%</span></div><div class="trk" style="margin-top:10px;height:8px"><i data-w="${goalP}" style="background:var(--lime)"></i></div></div>
 <div class="sec" id="map"><b>Уровни</b><span class="sm">A1 → B2</span></div>${lcards}
 ${qs||nc?`<div class="card0"><b style="font-weight:500">От репетитора</b>${nc?`<div class="sm" style="margin-top:6px">Новых карточек из чата: ${nc}</div>`:''}${qs}</div>`:''}
 <div class="card0"><b style="font-weight:500">Мои данные</b><div class="sm" style="margin-top:6px">Прогресс хранится только в вашем браузере и никому не отправляется. Сохраните копию, чтобы перенести его на другое устройство.</div><div class="row" style="margin-top:10px"><button class="btn" id="ex" style="padding:10px">Экспорт</button><button class="btn" id="im" style="padding:10px">Импорт</button></div><button class="btn" id="rs" style="margin-top:8px;padding:10px;color:var(--no)">Сбросить прогресс</button><input type="file" id="fi" accept="application/json" hidden></div>`;
 dataBtns();$('#pl').onclick=()=>startPlay('feed');$('#rp').onclick=()=>startPlay('rep');
 app.querySelectorAll('.act').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='map')document.getElementById('map').scrollIntoView({behavior:'smooth'});else go(a)});
 document.querySelectorAll('.trk i').forEach(e=>{const w=e.dataset.w;requestAnimationFrame(()=>requestAnimationFrame(()=>e.style.width=w+'%'))});
}
function dataBtns(){
 $('#ex').onclick=()=>{save();const b=new Blob([JSON.stringify(ST)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tilde-progress-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.c!=='object')throw 0;if(!confirm('Заменить текущий прогресс файлом?'))return;applyState(j);lsSet();home()}catch(_){alert('Не удалось прочитать файл')}};r.readAsText(f)};
 $('#rs').onclick=()=>{if(confirm('Удалить весь прогресс на этом устройстве? Это нельзя отменить.')){try{localStorage.removeItem(LSK)}catch(e){}location.reload()}};
}
function startPlay(m){mode=m;go('play')}
function repDone(){
 const el=document.createElement('div');el.className='ov';
 el.innerHTML=`<div class="t">Повтор завершён</div><div class="bdg a" style="font-size:34px">✓</div><div class="h">Все ошибки повторены</div><div class="s">Слов в «знаю»: ${KW.size}. Учу: ${LW.size}.</div><button class="btn pr" id="g1" style="max-width:260px">Играть дальше</button><button class="btn" id="g2" style="max-width:260px">На главную</button>`;
 document.body.appendChild(el);say('¡Muy bien!');
 $('#g1').onclick=()=>{el.remove();startPlay('feed')};$('#g2').onclick=()=>{el.remove();go('home')};
}
function study(){
 const L=learnIdx();
 const items=L.map(i=>{const w=POOL[i],g=w[6]==='грамм';return `<div class="card0" style="margin-top:10px"><div class="row"><div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:500">${g?esc(w[4]):`${w[0]?`<span class="${w[0]==='el'||w[0]==='los'?'am':'af'}">${esc(w[0])}</span> `:''}${esc(w[1])}`}</div><div style="font-size:16px;margin-top:4px">${g?esc(w[5]):esc(w[2])}</div></div><button class="ib" data-i="${i}" aria-label="Произнести">&#9654;</button></div>${g?'':`<div class="sm" style="margin-top:8px">${esc(w[4])}<br>${esc(w[5])}</div>`}<div class="mu" style="margin-top:6px">${esc(w[7])} · ${esc(w[8])}</div></div>`}).join('');
 app.innerHTML=`<div class="hdr"><button class="ib" id="bk">Назад</button><h1>Изучить ошибки</h1></div>${L.length?`<div class="sm">Прочитай слова, ошибки в которых были. Потом проверь себя.</div>${items}<button class="btn pr" id="ck2" style="margin-top:14px">Проверить себя · ${L.length}</button>`:`<div class="card0"><b style="font-weight:500">Ошибок нет</b><div class="sm" style="margin-top:6px">Здесь появятся слова, в которых ты ошибся.</div></div>`}`;
 $('#bk').onclick=()=>go('home');
 const c=$('#ck2');if(c)c.onclick=()=>startPlay('rep');
 app.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const w=POOL[+b.dataset.i];say(w[6]==='грамм'?w[4]:full(w),true)});
}
function words(){
 let tab='k';
 const draw=()=>{
  const list=[...(tab==='k'?KW:LW)].sort((a,b)=>a.localeCompare(b,'es'));
  $('#wl').innerHTML=list.length?list.map(x=>`<span class="chip ${tab}">${esc(x)}</span>`).join(''):'<span class="sm">Пока пусто</span>';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 };
 app.innerHTML=`<div class="hdr"><button class="ib" id="bk">Назад</button><h1>Мои слова</h1></div><div class="tabs"><button data-t="k">Знаю · ${KW.size}</button><button data-t="l">Учу · ${LW.size}</button></div><div class="chips" id="wl"></div><button class="btn" id="st2" style="margin-top:14px">Изучить ошибки · ${LW.size?learnIdx().length:0}</button><div class="mu" style="margin-top:12px">Каждое слово считается один раз, даже если оно встретилось в разных фразах.</div>`;
 $('#bk').onclick=()=>go('home');$('#st2').onclick=()=>go('study');
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});draw();
}
// ---------- play
let front=null,back=null,busy=false,hold=false,combo=0,sg;
const fast=matchMedia('(prefers-reduced-motion:reduce)').matches;const T=n=>fast?10:n;
function strip(){const cl=curLv();return LV.map(L=>{const s=lvStat(L);let c='lv',i;
 if(s.t===0)i=`<b>${L}</b>скоро`;else if(s.k===s.t){c+=' done';i=`<b>${L} ✓</b>${s.k}/${s.t}`}else if(L===cl){c+=' cur';i=`<b>${L}</b>${s.k}/${s.t}`}else i=`<b>${L}</b>${s.t} карт.`;
 return `<div class="${c}">${i}</div>`}).join('')}
function mk(idx){
 const w=POOL[idx],s=Math.random()<.5?0:1,el=document.createElement('div');
 const len=full(w).length,cls=len>26?' ch':(len>14?' m':'');
 el.className='cd';el.dataset.idx=idx;el.dataset.side=s;
 el.innerHTML=`<span class="tag">${esc(w[7])} · ${esc(w[8])} · ${w[6]==='грамм'?'грамматика':tok(full(w)).length+' сл.'}</span><button class="spk" aria-label="Произнести">&#9654;</button><div class="top"><div class="w${cls}">${w[0]?`<span class="${w[0]==='el'||w[0]==='los'?'am':'af'}">${esc(w[0])}</span> `:''}${esc(w[1])}</div></div><div class="pair"><div class="op" data-s="0"><i>&larr;</i><span>${esc(s===0?w[2]:w[3])}</span></div><div class="op" data-s="1"><i>&rarr;</i><span>${esc(s===0?w[3]:w[2])}</span></div></div>`;
 el.querySelector('.spk').onclick=e=>{e.stopPropagation();say(w[6]==='грамм'?w[4]:full(w),true)};
 return el;
}
function play(){
 dayTick();
 if(mode==='rep'&&pick([])===undefined){app.innerHTML=`<div class="hdr"><button class="ib" id="bk">Назад</button><h1>Повтор ошибок</h1></div><div class="card0"><b style="font-weight:500">Ошибок нет</b><div class="sm" style="margin-top:6px">Все слова, в которых ты ошибался, уже выучены. Продолжай играть, и новые ошибки появятся здесь.</div></div>`;$('#bk').onclick=()=>go('home');return}
 app.innerHTML=`<div class="hdr"><button class="ib" id="bk">Назад</button><span class="sp"></span><span class="sm" id="cmb"></span><span class="sm" id="xpt"></span><button class="ib${muted?' off':''}" id="snd">${muted?'Звук выкл':'Звук'}</button></div>
 <div class="lvs" id="lvs"></div><div class="bar g"><i id="gp"></i></div>
 <div class="stage" id="sg"><div class="stamp" id="stp"></div></div>
 <div class="toast" id="ts">${mode==='rep'?'Повтор ошибок: сюда попадают слова, в которых ты ошибся. Ответь верно, и слово станет «знаю».':'Свайпни карточку к правильному переводу. Влево или вправо, или просто нажми на ответ.'}</div>
 <div class="cnt"><div class="l"><span>Учу слов</span><b id="cl">0</b></div><div class="k"><span>Знаю слов</span><b id="ck">0</b></div></div>`;
 sg=$('#sg');bind();
 $('#bk').onclick=()=>{save();go('home')};
 $('#snd').onclick=()=>{muted=!muted;try{localStorage.setItem('es_muted',muted?'1':'0')}catch(e){}const b=$('#snd');b.classList.toggle('off',muted);b.textContent=muted?'Звук выкл':'Звук';if(muted){try{speechSynthesis.cancel()}catch(e){}}};
 busy=false;hold=false;combo=0;
 const a=pick([]);front=mk(a);sg.appendChild(front);front.classList.add('front');
 front.animate([{opacity:0,transform:'translateY(30px) scale(.95)'},{opacity:1,transform:'none'}],{duration:T(450),easing:'cubic-bezier(.2,.8,.2,1)'});
 const b0=pick([a]);back=b0!==undefined?mk(b0):null;if(back){sg.appendChild(back);back.classList.add('back')}
 upd();
}
function upd(){
 $('#cl').textContent=LW.size;$('#ck').textContent=KW.size;$('#lvs').innerHTML=mode==='rep'?`<div class="lv cur"><b>Повтор ошибок</b>осталось ${learnIdx().length}</div>`:strip();
 $('#gp').style.width=Math.min(100,ST.tn/GOAL*100)+'%';
 $('#xpt').textContent=ST.xp+' XP';$('#cmb').textContent=combo>1?'серия ×'+combo:'';
}
const bump=el=>el.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:T(420),easing:'cubic-bezier(.34,1.56,.64,1)'});
function floatXp(n){const e=document.createElement('div');e.className='xp';e.textContent='+'+n+' XP';document.body.appendChild(e);e.animate([{opacity:0,transform:'translate(-50%,10px)'},{opacity:1,transform:'translate(-50%,-10px)',offset:.3},{opacity:0,transform:'translate(-50%,-50px)'}],{duration:T(900),easing:'ease-out'}).finished.then(()=>e.remove())}
function levelUp(L){
 const nx=LV.slice(LV.indexOf(L)+1).find(x=>lvStat(x).t>0),n=nx?lvStat(nx).t:0;
 const el=document.createElement('div');el.className='ov';
 el.innerHTML=`<div class="t">Уровень пройден</div><div class="r"><div class="bdg a">${L}</div><div class="ln"><i></i></div><div class="bdg b">${nx||'?'}</div></div><div class="h">${nx?'Переходим на '+nx:'Все карточки пройдены'}</div><div class="s">${nx?'Новых карточек на '+nx+': '+n+'. Слов в «знаю»: '+KW.size+'.':'Новые карточки добавит репетитор в чате. Пока лента повторяет выученное.'}</div><button class="btn pr" id="go">${nx?'Начать '+nx:'Продолжить повтор'}</button>`;
 document.body.appendChild(el);say(nx?'¡Enhorabuena! Nivel completado.':'¡Enhorabuena!');
 $('#go').onclick=()=>{el.animate([{opacity:1},{opacity:0}],{duration:T(300),fill:'forwards'}).finished.then(()=>{el.remove();hold=false;busy=false;const a=front?+front.dataset.idx:-1;if(back)back.remove();back=mk(pick(a>=0?[a]:[]));sg.appendChild(back);back.classList.add('back');upd()})};
}
function answer(s){
 if(busy||!front)return;busy=true;
 const idx=+front.dataset.idx,sd=+front.dataset.side,ok=s===sd,w=POOL[idx],gr=w[6]==='грамм',ws=gr?[]:[...new Set(tok(full(w)))];
 const ps=front.querySelectorAll('.op');ps.forEach(p=>p.classList.remove('pre'));
 ps[sd].classList.add('ok');if(!ok)ps[s].classList.add('no');
 front.classList.remove('drag');front.classList.add(ok?'good':'bad');
 const stp=$('#stp');stp.className='stamp '+(ok?'g':'r');stp.textContent=ok?'✓':'✕';void stp.offsetWidth;stp.classList.add('show');
 const c=cs(w[1]);let nw=[],lw=[];c.n++;
 let gain=0;
 if(ok){combo++;gain=10+Math.min(combo,5)*2;ST.xp+=gain;
  ws.forEach(t=>{if(!KW.has(t))nw.push(t);KW.add(t);LW.delete(t)});
  c.b=Math.min((c.s==='k'?c.b:0)+1,4);c.s='k';c.d=ST.step+[8,20,50,120][c.b-1]}
 else{combo=0;ws.forEach(t=>{if(!KW.has(t)&&!LW.has(t))lw.push(t);if(!KW.has(t))LW.add(t)});c.s='l';c.b=0;c.d=ST.step+3;ST.err=[w[1],...ST.err.filter(x=>x!==w[1])].slice(0,20)}
 ST.step++;ST.tn++;streakTouch();
 const L=w[7],sL=lvStat(L),done=ok&&sL.t>0&&sL.k===sL.t&&!ST.ups.includes(L);
 if(done){ST.ups.push(L);hold=true}
 save();
 const ts=$('#ts');ts.className='toast '+(ok?'g':'r');
 ts.innerHTML=`<b>${esc(gr?w[4]:full(w)+' — '+w[2])}</b><div class="s">${esc(gr?w[5]:w[4]+' '+w[5])}</div><div class="nw">${gr?(ok?'Правило закреплено':'Вернётся через 3 карточки'):ok?(nw.length?'+'+nw.length+' в «знаю»: '+esc(nw.join(', ')):'Все слова уже были в «знаю»'):(lw.length?'+'+lw.length+' в «учу»: '+esc(lw.join(', '))+'. Вернётся через 3 карточки':'Вернётся через 3 карточки')}</div>`;
 say(gr?w[4]:full(w));if(ok)floatXp(gain);
 const dir=s===0?-1:1,cur=front.style.transform||'none',old=front;old.style.zIndex=3;
 old.animate([{transform:cur,opacity:1},{transform:`translateX(${dir*420}px) rotate(${dir*26}deg)`,opacity:0}],{duration:T(400),easing:'cubic-bezier(.3,.7,.4,1)',fill:'forwards'}).finished.then(()=>old.remove());
 upd();if(nw.length||lw.length)bump(nw.length?$('#ck'):$('#cl'));
 let nf=back;
 if(!nf){const np=pick([]);if(np===undefined){front=null;setTimeout(repDone,T(700));return}nf=mk(np);sg.appendChild(nf);nf.classList.add('front');nf.animate([{opacity:0,transform:'translateY(30px) scale(.95)'},{opacity:1,transform:'none'}],{duration:T(420),delay:T(250),fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'})}
 else{nf.classList.remove('back');nf.classList.add('front');nf.animate([{transform:'translateY(14px) scale(.94)'},{transform:'none'}],{duration:T(380),easing:'cubic-bezier(.2,.8,.2,1)'})}
 front=nf;
 if(done){back=null;setTimeout(()=>levelUp(L),T(900));return}
 const nb=pick([+nf.dataset.idx]);back=nb!==undefined?mk(nb):null;if(back){sg.appendChild(back);back.classList.add('back');back.animate([{opacity:0},{opacity:1}],{duration:T(300),delay:T(150),fill:'backwards'})}
 setTimeout(()=>{if(!hold)busy=false},T(260));
}
let sx=0,dx=0,dr=false,tapS=null;const TH=60;
const ops=()=>front?front.querySelectorAll('.op'):[];
function clr(){ops().forEach(p=>p.classList.remove('pre'));if(front)front.classList.remove('drag')}
function bind(){
 sg.addEventListener('pointerdown',e=>{if(busy||!front||e.target.closest('.spk'))return;if(!e.target.closest('.cd.front'))return;dr=true;sx=e.clientX;dx=0;const o=e.target.closest('.op');tapS=o?+o.dataset.s:null;try{sg.setPointerCapture(e.pointerId)}catch(_){}});
 sg.addEventListener('pointermove',e=>{if(!dr)return;dx=e.clientX-sx;if(Math.abs(dx)>6)front.classList.add('drag');
  front.style.transform=`translateX(${dx}px) rotate(${Math.max(-16,Math.min(16,dx/16))}deg)`;
  const p=ops();p[0]&&p[0].classList.toggle('pre',dx<-TH/2);p[1]&&p[1].classList.toggle('pre',dx>TH/2)});
 sg.addEventListener('pointerup',()=>{if(!dr)return;dr=false;const m=Math.abs(dx),d=dx;
  if(m>TH)answer(d<0?0:1);
  else if(m<8&&tapS!==null){front.style.transform='';answer(tapS)}
  else{clr();front.animate([{transform:front.style.transform||'none'},{transform:'none'}],{duration:T(380),easing:'cubic-bezier(.34,1.56,.64,1)'});front.style.transform=''}
  dx=0});
 sg.addEventListener('pointercancel',()=>{dr=false;clr();if(front)front.style.transform='';dx=0});
}
// ---------- start
async function loadCards(){
 try{const r=await fetch('cards.json');const a=await r.json();const have=new Set(POOL.map(w=>w[1]));
  a.forEach(d=>{if(have.has(d.es))return;have.add(d.es);POOL.push([d.art,d.es,d.ru,d.wrong,d.ex,d.exRu,d.type,d.level,d.topic])})}catch(e){}
}
(async function(){
 try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
 await loadCards();
 const loc=lsGet();
 if(loc&&loc.c){applyState(loc)}else{applyState({});seedState();lsSet()}
 go('home');
 
 if(dbm){sync='подключаю…';const s=$('#sync');if(s)s.textContent=sync;
  const before=ST.t;await pullDb();
  if(!ST.c||!Object.keys(ST.c).length){seedState()}
  lsSet();pushDb();
  if(window._scr==='home')home();
 }
})();
</script>
