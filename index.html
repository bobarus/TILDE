<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tilde">
<title>Tilde — испанский по карточкам</title>
<meta name="description" content="Бесплатное приложение для изучения испанских слов. Прогресс хранится только на вашем устройстве.">
<meta name="theme-color" content="#171716">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--tx2:#5f5e5a;--mu:#8a8982;--bd:rgba(0,0,0,.12);--bd2:rgba(0,0,0,.2);--neu:#ecebe5;--ac:#185FA5;--acb:#e6f1fb;--acbd:#85b7eb;--ok:#0f6e56;--okb:#e1f5ee;--okbd:#5dcaa5;--okf:#1d9e75;--no:#a32d2d;--nob:#fcebeb;--nobd:#f09595;--nof:#e24b4a;--wa:#854f0b;--wab:#faeeda;--mx:480px}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--sf:#222220;--tx:#f1efe8;--tx2:#b4b2a9;--mu:#8a8982;--bd:rgba(255,255,255,.14);--bd2:rgba(255,255,255,.24);--neu:#2c2c2a;--ac:#85b7eb;--acb:#0c2d4d;--acbd:#378add;--ok:#9fe1cb;--okb:#04342c;--okbd:#1d9e75;--okf:#1d9e75;--no:#f7c1c1;--nob:#3b1212;--nobd:#a32d2d;--nof:#e24b4a;--wa:#fac775;--wab:#412402}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:var(--mx);margin:0 auto;padding:14px 16px 28px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:.5px solid var(--bd2);background:var(--sf);border-radius:14px;padding:13px 16px;font-size:16px;font-weight:500}
.btn.pr{background:var(--ac);color:#fff;border-color:transparent}
@media(prefers-color-scheme:dark){.btn.pr{color:#04213a}}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
h1{font-size:22px;font-weight:500;margin:0}
.sm{font-size:13px;color:var(--tx2)}
.mu{font-size:12px;color:var(--mu)}
.card0{background:var(--sf);border:.5px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--sf);border:.5px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--tx2)}
.bar{height:8px;border-radius:4px;background:var(--neu);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.g i{background:var(--okf)}
.map{position:relative;margin-top:6px;padding-left:46px}
.map:before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:3px;background:var(--neu);border-radius:2px}
.nd{position:relative;margin-bottom:10px}
.nd .dot{position:absolute;left:-46px;top:6px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;background:var(--neu);color:var(--mu);border:.5px solid var(--bd)}
.nd.cur .dot{background:var(--acb);color:var(--ac);border-color:var(--acbd);box-shadow:0 0 0 4px var(--acb)}
.nd.done .dot{background:var(--okb);color:var(--ok);border-color:var(--okbd)}
.nd .bx{background:var(--sf);border:.5px solid var(--bd);border-radius:14px;padding:10px 12px}
.nd.lock .bx{opacity:.55}
.tp{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;gap:8px}
.tp span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .bar{width:70px;align-self:center;height:6px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ib{border:.5px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 12px;font-size:14px}
.ib.off{background:var(--nob);color:var(--no);border-color:var(--nobd)}
.lvs{display:flex;gap:6px;margin-bottom:8px}
.lv{flex:1;border-radius:10px;padding:5px 2px;text-align:center;font-size:11px;background:var(--neu);color:var(--mu);border:.5px solid transparent;transition:.4s}
.lv b{display:block;font-size:14px;font-weight:500}
.lv.cur{background:var(--acb);color:var(--ac);border-color:var(--acbd)}
.lv.done{background:var(--okb);color:var(--ok)}
.stage{position:relative;height:330px;touch-action:pan-y;margin-top:12px}
.cd{position:absolute;inset:0;border-radius:22px;border:.5px solid var(--bd2);background:var(--sf);display:flex;flex-direction:column;padding:16px 12px 12px;transition:background-color .2s,border-color .2s;will-change:transform}
.cd.front{z-index:2;cursor:grab}
.cd.back{z-index:1;transform:translateY(14px) scale(.94);pointer-events:none}
.cd.drag{border-color:var(--acbd)}
.cd.good{background:var(--okb);border-color:var(--okbd)}
.cd.bad{background:var(--nob);border-color:var(--nobd)}
.tag{position:absolute;top:12px;left:16px;font-size:12px;color:var(--mu)}
.spk{position:absolute;top:4px;right:6px;padding:8px 10px;border:none;background:transparent;color:var(--tx2);font-size:20px}
.top{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;padding:0 4px}
.w{font-size:36px;font-weight:500;line-height:1.2}.w.m{font-size:28px}.w.ch{font-size:23px}
.am{color:#185FA5}.af{color:#993C1D}
@media(prefers-color-scheme:dark){.am{color:#85B7EB}.af{color:#F0997B}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{border:.5px solid var(--bd2);border-radius:16px;background:var(--neu);min-height:100px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:20px;font-weight:500;line-height:1.15;word-break:break-word;transition:.2s}
.op i{font-style:normal;font-size:22px;color:var(--mu)}
.op.pre{background:var(--acb);border-color:var(--acbd);color:var(--ac);transform:translateY(-4px) scale(1.04)}
.op.ok{background:var(--okb);border-color:var(--okbd);color:var(--ok)}
.op.no{background:var(--nob);border-color:var(--nobd);color:var(--no)}
.stamp{position:absolute;z-index:5;top:50%;left:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:500;color:#fff;opacity:0;pointer-events:none;transform:scale(0)}
.stamp.g{background:var(--okf)}.stamp.r{background:var(--nof)}
.stamp.show{animation:st .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes st{0%{transform:scale(0) rotate(-20deg);opacity:0}30%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
.toast{margin-top:26px;min-height:84px;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;background:var(--neu);color:var(--tx2);transition:.25s}
.toast.g{background:var(--okb);color:var(--ok)}.toast.r{background:var(--nob);color:var(--no)}
.toast b{font-weight:500;font-size:16px}.toast .s{color:var(--tx);opacity:.85}.toast .nw{margin-top:4px;font-size:13px;font-weight:500}
.cnt{display:flex;gap:10px;margin-top:10px}
.cnt div{flex:1;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.cnt .l{background:var(--wab);color:var(--wa)}.cnt .k{background:var(--okb);color:var(--ok)}
.cnt b{font-size:22px;font-weight:500}
.xp{position:fixed;left:50%;top:90px;z-index:50;font-weight:500;font-size:20px;color:var(--okf);pointer-events:none;transform:translateX(-50%)}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:fi .4s both}
@keyframes fi{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ov .t{font-size:13px;color:var(--tx2)}
.ov .r{display:flex;align-items:center;gap:12px}
.bdg{position:relative;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500}
.bdg.a{background:var(--okb);color:var(--ok);border:.5px solid var(--okbd);animation:pp .6s .2s cubic-bezier(.34,1.56,.64,1) both}
.bdg.b{background:var(--acb);color:var(--ac);border:.5px solid var(--acbd);animation:pp .7s 1.1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pp{from{transform:scale(0)}to{transform:scale(1)}}
.ln{width:60px;height:4px;border-radius:2px;background:var(--neu);overflow:hidden}
.ln i{display:block;height:100%;width:0;background:var(--ac);animation:fl .6s .7s ease-out both}
@keyframes fl{to{width:100%}}
.ov .h{font-size:22px;font-weight:500;animation:fi .5s 1.3s both}.ov .s{font-size:14px;color:var(--tx2);animation:fi .5s 1.5s both}.ov .btn{max-width:260px;animation:fi .5s 1.7s both}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:.5px solid var(--bd);background:var(--sf);font-size:14px}
.tabs button.on{background:var(--acb);color:var(--ac);border-color:var(--acbd)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:14px;background:var(--neu)}
.chip.k{background:var(--okb);color:var(--ok)}.chip.l{background:var(--wab);color:var(--wa)}
.q{border-left:3px solid var(--ac);padding-left:10px;margin-top:8px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important;animation-delay:0s!important}}

/* ---- visual refresh ---- */
:root{--lime:#c8f31d;--ink:#171716;--gl:rgba(255,255,255,.62);--glb:rgba(255,255,255,.75);--bg:#e8eae4}
@media(prefers-color-scheme:dark){:root{--gl:rgba(40,40,38,.62);--glb:rgba(255,255,255,.12);--bg:#121211;--ink:#0d0d0c}}
body{background:var(--bg);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(420px 320px at 85% 8%,rgba(200,243,29,.35),transparent 70%),radial-gradient(380px 300px at 5% 55%,rgba(255,190,120,.30),transparent 70%),radial-gradient(420px 320px at 90% 95%,rgba(130,170,255,.25),transparent 70%)}
#app{padding-bottom:120px}
.card0,.stat,.nd .bx,.toast,.cnt div{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card0{background:var(--gl);border:1px solid var(--glb);border-radius:22px}
.stat{background:var(--gl);border:1px solid var(--glb);border-radius:20px;padding:14px 12px;text-align:left}
.stat b{font-size:26px}
.btn.pr{background:var(--lime);color:#111;border-radius:999px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#1f1f1d,#111110);color:#f4f3ee;border-radius:28px;padding:20px 16px 16px;margin-top:6px}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.07) 0 2px,transparent 2px 16px)}
.hl{font-size:14px;color:#b9b8b0;text-align:center;position:relative}
.hn{font-size:46px;font-weight:500;text-align:center;letter-spacing:-.5px;position:relative;margin:2px 0}
.hs{font-size:13px;color:#b9b8b0;text-align:center;position:relative}
.acts{position:relative;margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:14px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.act{background:none;border:none;color:#d9d8d0;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
.act:active{transform:scale(.95)}
.ci{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.ci.lime{background:var(--lime);color:#111}
.ci svg{width:24px;height:24px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile small{display:block;font-size:12px;color:var(--tx2)}
.tile b{display:block;font-size:26px;font-weight:500;margin-top:6px}
.tile span{font-size:12px;font-weight:500}
.tile .dn{color:var(--okf)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.sec b{font-size:17px;font-weight:500}
.lc{background:var(--gl);border:1px solid var(--glb);border-radius:22px;padding:12px;margin-bottom:10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lc.lock{opacity:.6}
.lh{display:flex;align-items:center;gap:12px}
.lic{width:44px;height:44px;border-radius:14px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;border:1px solid var(--bd)}
.lh .t{flex:1;min-width:0}.lh .t b{display:block;font-size:16px;font-weight:500}.lh .t span{font-size:12px;color:var(--tx2)}
.lar{width:34px;height:34px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--tx2)}
.lin{background:var(--sf);border-radius:16px;padding:10px 12px;margin-top:10px;border:1px solid var(--bd)}
.lin .row2{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.trk{height:6px;border-radius:3px;background:var(--neu);overflow:hidden}
.trk i{display:block;height:100%;width:0;border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tp2{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:8px;align-items:center}
.tp2 span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp2 .trk{width:70px;height:5px}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:8px;background:#111110;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.nav button{width:54px;height:54px;border-radius:50%;border:none;background:transparent;color:#d9d8d0;display:flex;align-items:center;justify-content:center;transition:.25s}
.nav button svg{width:24px;height:24px}
.nav button.on{background:var(--lime);color:#111}
.cd{box-shadow:0 8px 24px rgba(0,0,0,.08);border-radius:26px;background:var(--sf)}
.op{border-radius:18px}
.lv.cur{background:#111110;color:var(--lime);border-color:transparent}
.hdr h1{font-size:24px}
.chip{border-radius:12px}


/* ---- Tilde home v3 (Hero) ---- */
@keyframes hxrise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes hxglow{0%,100%{text-shadow:0 0 10px rgba(200,243,29,.8),0 0 26px rgba(200,243,29,.5)}50%{text-shadow:0 0 16px rgba(200,243,29,1),0 0 40px rgba(200,243,29,.7)}}
@keyframes hxsheen{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes wdrift{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
@keyframes wdis{0%{opacity:0;filter:blur(8px);scale:.7}20%{opacity:var(--o2);filter:blur(0);scale:1}65%{opacity:var(--o1);filter:blur(0);scale:1}100%{opacity:0;filter:blur(10px);scale:1.15}}
.hx{position:relative;margin-top:14px;border-radius:30px;padding:20px 16px 18px;background:linear-gradient(160deg,#1f1f1d,#111110);color:#f4f3ee;overflow:hidden;animation:hxrise .7s cubic-bezier(.2,.9,.25,1) .1s both}
.hx .wds{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.wd{position:absolute;white-space:nowrap;font-weight:700;letter-spacing:-.3px;color:#9a9a92;opacity:var(--o1);animation:wdrift var(--d) ease-in-out var(--dl) infinite,wdis calc(var(--p)*1.8) ease-in-out var(--dl) infinite}
.hx .st{position:relative;display:flex;gap:10px}
.hx .sb{flex:1;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hx .sb .lb{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hx .sb .nn{display:block;margin-top:6px;font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.hx .sb .cp{display:block;margin-top:8px;font-size:12px;color:#a9a8a0}
.hx .gl{position:relative;margin-top:14px;display:flex;justify-content:space-between;font-size:12px;color:#a9a8a0}
.hx .gb{position:relative;margin-top:6px;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.hx .gb i{position:relative;display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#d9ff4a,#b6e817);box-shadow:0 0 14px rgba(200,243,29,.7);overflow:hidden;transition:width 1s cubic-bezier(.2,.9,.25,1)}
.hx .gb i:after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:hxsheen 2.6s ease-in-out infinite}
.hxb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:999px;font-family:inherit;transition:transform .2s cubic-bezier(.2,.9,.25,1)}
.hxb:active{transform:scale(.97)}
.hxb.go{margin-top:14px;padding:18px;background:var(--lime);color:#111;font-size:18px;font-weight:700;box-shadow:0 12px 28px rgba(160,200,0,.35)}
.hxb.rp{margin-top:10px;padding:15px;background:linear-gradient(180deg,rgba(90,92,86,.82),rgba(60,62,58,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f4f3ee;font-size:16px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.22)}
.hxb .bn{min-width:26px;height:26px;box-sizing:border-box;border-radius:50%;background:#171716;color:#ff9a2e;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;text-shadow:0 0 8px rgba(255,154,46,.8);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.kw{position:relative;margin-top:14px;display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#232321,#141413);box-shadow:0 12px 28px rgba(0,0,0,.22);color:#f4f3ee}
.kw .gw{position:absolute;left:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(200,243,29,.35),transparent 70%)}
.kw .hl2{position:absolute;right:14px;bottom:-14px;font-size:64px;font-weight:800;letter-spacing:-2px;color:rgba(255,255,255,.05)}
.kw .n{position:relative;font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--lime);animation:hxglow 3s ease-in-out infinite}
.kw .ln{position:relative;width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.3),transparent)}
.kw .tt{position:relative;flex:1}.kw .tt small{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a9a8a0}.kw .tt span{display:block;margin-top:3px;font-size:17px;font-weight:600}
.lx{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;margin-top:8px}
.lx .bx{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.lx .t{flex:1;min-width:0}.lx .t b{display:block;font-size:15px;font-weight:600}.lx .t span{font-size:12px}
.lx.cur{display:block;padding:14px;border-radius:22px;background:#171716;color:#f4f3ee;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.lx.cur .rw{display:flex;align-items:center;gap:12px}.lx.cur .bx{background:var(--lime);color:#111}.lx.cur .t span{color:#a9a8a0}
